name: Link check

on:
  # PRs are created as DRAFT by the /blog skill and marked ready only when the
  # post is final, so the internal check runs ONCE per PR — at the moment the PR
  # becomes mergeable. `synchronize` is deliberately absent: without it, the
  # intermediate pushes during drafting/review no longer each trigger a full run.
  #
  # Consequences to be aware of:
  #   - A PR opened directly as ready (not draft) fires no run. Toggle it with
  #     `gh pr ready --undo` then `gh pr ready`, or use workflow_dispatch.
  #   - Pushing more commits to an ALREADY-ready PR does not re-run the check,
  #     so its status reflects the commit at ready time. Re-toggle as above.
  pull_request:
    types: [ready_for_review, reopened]
  push:
    branches: ["main"]
  schedule:
    # Weekly external-link sweep: Monday 00:00 UTC (09:00 JST)
    - cron: "0 0 * * 1"
  workflow_dispatch:

# Safety net for the re-toggle cases above: never let a superseded run keep
# burning minutes once a newer one starts for the same ref.
concurrency:
  group: linkcheck-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  HUGO_VERSION: 0.157.0
  LYCHEE_VERSION: 0.24.2

jobs:
  # ---------------------------------------------------------------------------
  # Internal-link check (blocking). Runs on PRs and pushes.
  # Builds the site, mirrors it under the /blogs/ base path, serves it locally,
  # and checks that every INTERNAL link/image resolves. External links are
  # excluded here (they are handled by the weekly job) so this stays fast and
  # deterministic. A missing /blogs prefix or a wrong slug becomes a 404.
  # ---------------------------------------------------------------------------
  internal:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build site
        env:
          HUGO_ENVIRONMENT: production
          TZ: Asia/Tokyo
        run: hugo --gc --minify --baseURL "https://hdknr.github.io/blogs/"

      - name: Mirror to /blogs base path
        run: |
          mkdir -p _site/blogs
          cp -a public/. _site/blogs/

      - name: Serve site locally
        run: |
          nohup python3 -c "
          from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler
          import functools
          h = functools.partial(SimpleHTTPRequestHandler, directory='_site')
          ThreadingHTTPServer(('127.0.0.1', 8099), h).serve_forever()
          " >/dev/null 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8099/blogs/ && break
            sleep 0.5
          done

      - name: Install lychee
        run: |
          wget -O /tmp/lychee.tar.gz \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p /tmp/lychee-bin
          tar -xzf /tmp/lychee.tar.gz -C /tmp/lychee-bin
          sudo mv "$(find /tmp/lychee-bin -type f -name lychee | head -1)" /usr/local/bin/lychee
          lychee --version

      # The remap is scoped to /blogs/ on purpose. hdknr.github.io also hosts
      # SIBLING GitHub Pages projects (claude-code-setup, …) that are NOT in the
      # local mirror, so a host-wide remap rewrote those live URLs to the local
      # server and reported a spurious 404. Scoped this way, sibling-project
      # links fall outside --include and are swept by the weekly external job.
      - name: Check internal links
        run: |
          lychee \
            --no-progress \
            --base-url http://127.0.0.1:8099/ \
            --remap "https://hdknr.github.io/blogs/ http://127.0.0.1:8099/blogs/" \
            --include "^http://127\.0\.0\.1:8099/" \
            --max-concurrency 16 \
            './_site/blogs/**/*.html'

  # ---------------------------------------------------------------------------
  # External-link sweep (non-blocking). Runs weekly (and via workflow_dispatch).
  # Checks external URLs across the built site. Known bot-blocked hosts and
  # transient codes are tamed via lychee-external.toml, and anything that still
  # fails is re-checked in a calmer second pass, so the report stays signal-rich.
  # Links that fail twice open a NEW tracking issue (create-issue-from-file does
  # not update the previous one) instead of failing the run.
  # ---------------------------------------------------------------------------
  external:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Build (~2m) + first pass (up to ~15m on a bad day) + re-verification (20m cap).
    timeout-minutes: 45
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build site
        env:
          HUGO_ENVIRONMENT: production
          TZ: Asia/Tokyo
        run: hugo --gc --minify --baseURL "https://hdknr.github.io/blogs/"

      - name: Mirror to /blogs base path
        run: |
          mkdir -p _site/blogs
          cp -a public/. _site/blogs/

      - name: Serve site locally
        run: |
          nohup python3 -c "
          from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler
          import functools
          h = functools.partial(SimpleHTTPRequestHandler, directory='_site')
          ThreadingHTTPServer(('127.0.0.1', 8099), h).serve_forever()
          " >/dev/null 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8099/blogs/ && break
            sleep 0.5
          done

      - name: Install lychee
        run: |
          wget -O /tmp/lychee.tar.gz \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p /tmp/lychee-bin
          tar -xzf /tmp/lychee.tar.gz -C /tmp/lychee-bin
          sudo mv "$(find /tmp/lychee-bin -type f -name lychee | head -1)" /usr/local/bin/lychee
          lychee --version

      # Internal links resolve to the local server (base_url/remap in the
      # config) and are excluded, so only genuine EXTERNAL links are checked.
      - name: Check external links
        id: lychee
        run: |
          mkdir -p lychee
          set +e
          lychee --no-progress --config lychee-external.toml \
            --output ./lychee/report.md \
            './_site/blogs/**/*.html'
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      # The sweep shares a runner with everything else on it, so a congested run
      # reports links that are perfectly alive: #632 ran 15m and reported 112
      # timeouts, the week before ran 6m and reported 9, on a link set that had
      # grown 4%. Re-running those exact 107 URLs through the same lychee and
      # config from an ordinary network produced 0 timeouts.
      #
      # So re-check only what the first pass flagged, serially and with double
      # the timeout, and keep just the links that fail twice. A 404 fails both
      # passes; a stall on a busy runner does not.
      #
      # If the second pass cannot finish in time we have no trustworthy verdict,
      # so `confirmed` stays unset and no issue is opened — the step is allowed
      # to fail for that reason, and the degradation is noted in the job summary.
      - name: Re-verify reported links
        id: reverify
        if: steps.lychee.outputs.exit_code != '0'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          python3 scripts/linkcheck_reverify.py extract \
            ./lychee/report.md ./lychee/retry-urls.txt
          set +e
          lychee --no-progress --config lychee-external.toml \
            --timeout 60 --max-concurrency 2 \
            --output ./lychee/retry-report.md \
            ./lychee/retry-urls.txt
          python3 scripts/linkcheck_reverify.py filter \
            ./lychee/report.md ./lychee/retry-report.md ./lychee/confirmed.md
          echo "confirmed=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Note a degraded sweep
        if: steps.lychee.outputs.exit_code != '0' && steps.reverify.outputs.confirmed == ''
        run: |
          echo "### Sweep degraded" >> "$GITHUB_STEP_SUMMARY"
          echo "The first pass reported failures but the re-verification pass did"  >> "$GITHUB_STEP_SUMMARY"
          echo "not finish, so no issue was opened. Re-run this workflow to retry." >> "$GITHUB_STEP_SUMMARY"

      - name: Open issue on dead links
        if: steps.reverify.outputs.confirmed == '1'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Dead links detected by weekly lychee sweep"
          content-filepath: ./lychee/confirmed.md
          labels: link-check, automated
