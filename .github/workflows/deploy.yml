name: Deploy Astro site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # submodules stay on: the Hugo theme is still checked in, so reverting
      # this file is enough to put the Hugo build back exactly as it was.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Resolve Pagefind version
        run: echo "PAGEFIND_VERSION=$(cat .pagefindversion)" >> "$GITHUB_ENV"
      # Gate production on frontmatter validity. Astro's Zod schema catches most
      # of this now, but the category allow-list and the tag-collision check are
      # rules Zod does not express, and they run in a second rather than a build.
      - name: Validate frontmatter
        run: python3 scripts/validate_frontmatter.py
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: astro/package-lock.json
      - name: Install dependencies
        working-directory: astro
        run: npm ci
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Astro
        working-directory: astro
        env:
          TZ: Asia/Tokyo
        run: npx astro build
      # Astro leaves absolute-URL images alone, so the WebP renditions that
      # rehypePicture.mjs points at are produced here. 45.2MB of PNG becomes
      # 3.0MB at 640w -- the saving #648 introduced, carried across.
      - name: Generate image renditions
        working-directory: astro
        run: node scripts/generate-images.mjs
      # The URL comparison only counts index.html, which is blind to images: the
      # first cutover build looked perfect with dist/images/ empty and all 120
      # diagrams 404ing. This checks every referenced asset is on disk.
      - name: Check assets
        run: python3 scripts/check_assets.py astro/dist --base /blogs
      - name: Check internal links
        run: python3 scripts/check_links.py astro/dist --base /blogs
      # Pagefind indexes the BUILT html, so it runs after Astro and before the
      # upload. --glob restricts it to posts and the wiki: indexing the tag and
      # category pages as well doubled the index (13MB -> 29MB) and pushed
      # taxonomy pages above real articles in the results.
      - name: Build search index
        working-directory: astro
        run: npx -y pagefind@${PAGEFIND_VERSION} --site dist --glob "{posts,wiki}/**/*.html"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./astro/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
