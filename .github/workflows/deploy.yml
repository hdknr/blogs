name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      # .hugoversion is the single source of truth, shared with linkcheck.yml and
      # local builds. Pinning the version in each workflow separately is what let
      # CI (0.157.0) drift away from local (0.161.1).
      - name: Resolve Hugo version
        run: echo "HUGO_VERSION=$(cat .hugoversion)" >> "$GITHUB_ENV"
      - name: Resolve Pagefind version
        run: echo "PAGEFIND_VERSION=$(cat .pagefindversion)" >> "$GITHUB_ENV"
      # Gate production on frontmatter validity. Hugo accepts an unknown category
      # without complaint and builds a taxonomy page for it, so drift never turns
      # the build red on its own. Runs before the build so bad content never ships.
      - name: Validate frontmatter
        run: python3 scripts/validate_frontmatter.py
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: Asia/Tokyo
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      # Pagefind indexes the BUILT html, so it has to run after Hugo and before
      # the upload. --glob restricts it to posts and the wiki: indexing the tag
      # and category pages as well doubled the index (13MB -> 29MB) and pushed
      # taxonomy pages above real articles in the results.
      - name: Build search index
        run: npx -y pagefind@${PAGEFIND_VERSION} --site public --glob "{posts,wiki}/**/*.html"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
