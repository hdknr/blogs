baseURL = 'https://hdknr.github.io/blogs/'
locale = 'ja'
defaultContentLanguage = 'ja'
title = 'hdknr blog'
theme = 'PaperMod'
paginate = 10

# Hugo title-cases auto-generated taxonomy titles by default, which turns the
# tag `llm` into `Llm` and `claude-code` into `Claude-Code`. With the spellings
# normalised (scripts/normalize_tags.py) the frontmatter is the single source of
# truth for how a tag reads, so leave it alone.
titleCaseStyle = 'none'

# Mount static/images into assets as well, so the same PNG is both published
# verbatim at its existing /blogs/images/<name>.png URL and available to the
# image pipeline. Moving the files to assets/ instead would optimise them but
# 404 every raw image URL that already exists.
[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    source = 'static/images'
    target = 'assets/images'

[params]
  env = 'production'
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true

  [params.homeInfoParams]
    Title = 'hdknr blog'
    Content = 'Gist ブログのまとめサイト'

[permalinks]
  [permalinks.page]
    posts = '/posts/:year/:month/:slug/'

[taxonomies]
  category = 'categories'
  tag = 'tags'

[menu]
  [[menu.main]]
    identifier = 'categories'
    name = 'カテゴリ'
    url = '/categories/'
    weight = 10
  [[menu.main]]
    identifier = 'tags'
    name = 'タグ'
    url = '/tags/'
    weight = 20
  [[menu.main]]
    identifier = 'wiki'
    name = 'Wiki'
    url = '/wiki/'
    weight = 30
  [[menu.main]]
    identifier = 'archives'
    name = 'アーカイブ'
    url = '/archives/'
    weight = 40
  [[menu.main]]
    identifier = 'search'
    name = '検索'
    url = '/search/'
    weight = 50

[outputs]
  # JSON is gone: it produced a 14.4MB index.json for PaperMod's fuse.js search,
  # and this site never had a search page to consume it. Search is Pagefind now,
  # which builds its own chunked index after Hugo runs.
  home = ['HTML', 'RSS']

[markup]
  [markup.highlight]
    codeFences = true
    lineNos = true
    style = 'monokai'
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
